"""Requires an authenticated application credential"""
directive @auth on FIELD_DEFINITION | OBJECT

directive @key(fields: _FieldSet!) repeatable on OBJECT | INTERFACE

directive @requires(fields: _FieldSet!) on FIELD_DEFINITION

directive @provides(fields: _FieldSet!) on FIELD_DEFINITION

directive @external on FIELD_DEFINITION

directive @extends on OBJECT | INTERFACE

directive @tag(name: String!) repeatable on FIELD_DEFINITION | INTERFACE | OBJECT | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @link(url: String, as: String, for: Purpose, import: [Import]) repeatable on SCHEMA

"""Complete Exa Contents configuration supplied for one subscription"""
input AiFeedExaOptionsInput {
  """Maximum text characters requested from Exa"""
  textMaxCharacters: Int! = 200000

  """Whether Exa preserves HTML tags"""
  textIncludeHtmlTags: Boolean! = true

  """Requested text detail level"""
  textVerbosity: AiFeedTextVerbosity! = FULL

  """Only semantic sections Exa should include"""
  textIncludeSections: [AiFeedSectionTag!]! = []

  """Semantic sections Exa should exclude"""
  textExcludeSections: [AiFeedSectionTag!]! = []

  """Whether Exa highlights are requested"""
  highlightsEnabled: Boolean! = false

  """Optional highlights ranking query"""
  highlightsQuery: String

  """Maximum characters of highlights"""
  highlightsMaxCharacters: Int

  """Whether an Exa summary is requested"""
  summaryEnabled: Boolean! = false

  """Optional Exa summary query"""
  summaryQuery: String

  """Optional JSON schema for the Exa summary"""
  summarySchema: String

  """Maximum cached-content age in hours"""
  maxAgeHours: Int = 0

  """Live crawl timeout in milliseconds"""
  livecrawlTimeout: Int

  """Whether Exa should omit empty results"""
  filterEmptyResults: Boolean! = true

  """Number of related subpages Exa should return"""
  subpages: Int! = 0

  """Fuzzy targets used to rank subpages"""
  subpageTarget: [String!]! = []

  """Number of additional links to return"""
  extrasLinks: Int! = 0

  """Number of additional image links to return"""
  extrasImageLinks: Int! = 0
}

"""New per-subscription AI Feed configuration"""
input UpdateAiFeedSubscriptionSettingInput {
  """FreshRSS server scope"""
  serverId: String!

  """FreshRSS subscription identifier owned by the server"""
  feedId: String!

  """Whether enrichment and signed feed access are enabled"""
  enabled: Boolean!

  """Whether Exa content is preferred"""
  useExa: Boolean!

  """Hours of history to retain and enrich"""
  lookbackHours: Int! = 48

  """Minimum Qdrant similarity score shown in entries"""
  similarityThreshold: Float! = 0.8

  """Complete Exa Contents configuration"""
  exa: AiFeedExaOptionsInput!
}

"""
Application-wide AI Feed configuration and explicit credential operations
"""
input UpdateAiFeedGlobalSettingInput {
  """Prompt sent to the article summarizer"""
  summaryPrompt: String!

  """Selected OpenCode provider identifier"""
  openCodeProviderId: String

  """Selected OpenCode model identifier"""
  openCodeModelId: String

  """Selected model-specific effort variant"""
  openCodeVariant: String

  """A non-empty value replaces the stored key; null leaves it unchanged"""
  openCodeApiKey: String

  """Whether to remove the stored OpenCode provider key"""
  clearOpenCodeApiKey: Boolean = false

  """A non-empty value replaces the stored key; null leaves it unchanged"""
  exaApiKey: String

  """Whether to remove the stored Exa key"""
  clearExaApiKey: Boolean = false
}

"""One-off prompt test that does not persist settings or article data"""
input TestAiFeedPromptInput {
  """Prompt to test"""
  prompt: String!

  """OpenCode provider identifier"""
  providerId: String!

  """OpenCode model identifier"""
  modelId: String!

  """Optional model-specific effort variant"""
  variant: String

  """Sample article content supplied as untrusted input"""
  articleContent: String!

  """Optional temporary API key; null uses the encrypted stored key"""
  openCodeApiKey: String
}

"""Amount of page text Exa should return"""
enum AiFeedTextVerbosity {
  """Main content only"""
  COMPACT

  """Balanced content and detail"""
  STANDARD

  """Complete content from every selected section"""
  FULL
}

"""Semantic page sections understood by the Exa Contents API"""
enum AiFeedSectionTag {
  """Content without a recognized semantic section"""
  UNSPECIFIED

  """Page header content"""
  HEADER

  """Site navigation content"""
  NAVIGATION

  """Banner content"""
  BANNER

  """Main body content"""
  BODY

  """Sidebar content"""
  SIDEBAR

  """Page footer content"""
  FOOTER

  """Page metadata"""
  METADATA
}

"""Complete non-deprecated Exa Contents configuration for a subscription"""
type AiFeedExaOptions {
  """Maximum text characters requested from Exa"""
  textMaxCharacters: Int!

  """Whether Exa preserves HTML tags in returned text"""
  textIncludeHtmlTags: Boolean!

  """Requested text detail level"""
  textVerbosity: AiFeedTextVerbosity!

  """Only semantic sections Exa should include"""
  textIncludeSections: [AiFeedSectionTag!]!

  """Semantic sections Exa should exclude"""
  textExcludeSections: [AiFeedSectionTag!]!

  """Whether Exa highlights are requested"""
  highlightsEnabled: Boolean!

  """Optional highlights ranking query"""
  highlightsQuery: String

  """Maximum characters of highlights"""
  highlightsMaxCharacters: Int

  """Whether an Exa-provided summary is requested and stored"""
  summaryEnabled: Boolean!

  """Optional Exa summary query"""
  summaryQuery: String

  """Optional JSON schema for the Exa summary"""
  summarySchema: String

  """
  Maximum cached-content age, including Exa special values zero and negative one
  """
  maxAgeHours: Int

  """Live crawl timeout in milliseconds"""
  livecrawlTimeout: Int

  """Whether Exa should omit empty content results"""
  filterEmptyResults: Boolean!

  """Number of related subpages Exa should return"""
  subpages: Int!

  """Fuzzy targets used to rank returned subpages"""
  subpageTarget: [String!]!

  """Number of additional links to return"""
  extrasLinks: Int!

  """Number of additional image links to return"""
  extrasImageLinks: Int!
}

"""Per-FreshRSS-subscription AI Feed configuration"""
type AiFeedSubscriptionSetting {
  """Persisted setting identifier, absent until defaults are saved"""
  id: ID

  """FreshRSS server scope"""
  serverId: String!

  """FreshRSS subscription identifier"""
  feedId: String!

  """Whether the signed Atom feed and enrichment are enabled"""
  enabled: Boolean!

  """Whether the shared OpenCode provider, model, and key are ready"""
  configurationReady: Boolean!

  """Whether Exa content should be preferred over FreshRSS content"""
  useExa: Boolean!

  """Hours of FreshRSS history retained and enriched"""
  lookbackHours: Int!

  """Minimum Qdrant similarity score shown in entries"""
  similarityThreshold: Float!

  """Exa Contents options for this subscription"""
  exa: AiFeedExaOptions!

  """Revision used to invalidate stored enrichment fingerprints"""
  configurationRevision: Int!

  """ISO timestamp of the last feed-visible change"""
  feedUpdatedAt: String
}

"""
Application-wide AI Feed prompt, model selection, and credential status
"""
type AiFeedGlobalSetting {
  """Prompt sent to the dedicated article summarizer"""
  summaryPrompt: String!

  """Selected OpenCode provider identifier"""
  openCodeProviderId: String

  """Selected OpenCode model identifier"""
  openCodeModelId: String

  """Selected model-specific effort variant"""
  openCodeVariant: String

  """Whether an encrypted provider API key is stored"""
  hasOpenCodeApiKey: Boolean!

  """Whether an encrypted Exa API key is stored"""
  hasExaApiKey: Boolean!

  """Revision used to invalidate every in-window summary"""
  configurationRevision: Int!
}

"""One model reported dynamically by the embedded OpenCode server"""
type OpenCodeModelCatalogItem {
  """Provider-specific model identifier"""
  id: String!

  """Human-readable model name"""
  name: String!

  """Maximum model context in tokens"""
  contextLimit: Int!

  """Model-specific effort variants reported by OpenCode"""
  variants: [String!]!
}

"""One API-key provider and its available OpenCode models"""
type OpenCodeProviderCatalogItem {
  """OpenCode provider identifier"""
  id: String!

  """Human-readable provider name"""
  name: String!

  """Available non-deprecated models"""
  models: [OpenCodeModelCatalogItem!]!
}

"""
Non-negative safe integer timestamp in milliseconds since the Unix epoch
"""
scalar TimestampMilliseconds

"""
Non-negative safe integer timestamp in microseconds since the Unix epoch
"""
scalar TimestampMicroseconds

"""Root query type - extended by domain-specific schemas"""
type Query {
  """Basic health check query"""
  hello: String

  """Read redacted application-wide AI Feed configuration"""
  aiFeedGlobalSettings: AiFeedGlobalSetting!

  """Enumerate providers, models, and model-specific variants from OpenCode"""
  aiFeedOpenCodeCatalog: [OpenCodeProviderCatalogItem!]!

  """Generate a private scope-bound Atom feed URL"""
  getAiFeedUrl(
    """Persisted AI Feed setting identifier"""
    settingId: ID!
  ): String!

  """Retrieve RSS feed items from a specific stream with optional filtering"""
  getRssStreamContents(
    """Stream ID (defaults to reading list - all subscribed feeds)"""
    streamId: String = "user/-/state/com.google/reading-list"

    """Filtering and pagination options"""
    options: StreamContentsOptions

    """Number of similar items to find (defaults to 5)"""
    similarCount: Int = 5

    """Minimum similarity score threshold for similar items (0.0 to 1.0)"""
    minScore: Float

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): StreamContents!

  """Retrieve RSS feed items content by IDs for similarity search"""
  getRssStreamItemsContent(
    """Item IDs to retrieve content for"""
    ids: [String!]!

    """Number of similar items to find (defaults to 10)"""
    similarCount: Int = 10

    """Minimum similarity score threshold for similar items (0.0 to 1.0)"""
    minScore: Float

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): StreamContents!

  """Retrieve RSS feed item content by single ID for similarity search"""
  getRssStreamItemContent(
    """Item ID to retrieve content for"""
    id: String!

    """Number of similar items to find (defaults to 10)"""
    similarCount: Int = 10

    """Minimum similarity score threshold for similar items (0.0 to 1.0)"""
    minScore: Float

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): FeedItem!

  """Retrieve the complete list of RSS feed subscriptions"""
  getRssSubscriptionList(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): FeedSubscriptionList!

  """
  Retrieve the complete list of RSS tags/categories with associated subscriptions
  """
  getRssTagList(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): TagList!

  """Retrieve a single RSS tag/category by ID"""
  getRssTag(
    """Tag ID to retrieve"""
    id: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): TagItem

  """Retrieve unread counts for all feeds, folders, and states"""
  getRssUnreadCounts(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): UnreadCountList!

  """Retrieve all posts (both published and unpublished)"""
  posts: [Post!]!

  """Retrieve a specific post by ID"""
  post(
    """Unique identifier of the post to retrieve"""
    id: String!
  ): Post

  """Retrieve all FreshRSS servers with optional filtering"""
  getFreshRssServers(
    """Optional filter parameters"""
    filter: GetFreshRssServersInput
  ): [FreshRssServer!]!

  """Retrieve all Ollama servers"""
  getOllamaServers: [OllamaServer!]!

  """Retrieve a specific Ollama server by ID"""
  getOllamaServer(
    """Unique identifier of the Ollama server to retrieve"""
    id: ID!
  ): OllamaServer

  """Generate a test embedding using the specified Ollama server"""
  testOllamaEmbedding(
    """Text to generate embeddings for"""
    text: String!

    """Ollama server ID to use for the request"""
    serverId: ID!

    """Model to use (defaults to the server's configured model)"""
    model: String
  ): OllamaEmbeddingTestResult!

  """Retrieve all Qdrant servers"""
  getQdrantServers: [QdrantServer!]!

  """Retrieve a specific Qdrant server by ID"""
  getQdrantServer(
    """Unique identifier of the Qdrant server to retrieve"""
    id: ID!
  ): QdrantServer

  """Generate vector embeddings for the provided text"""
  getEmbeddings(
    """Text to generate embeddings for"""
    text: String!

    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): [Float!]!

  """Search for documents similar to the query text (general search)"""
  searchSimilar(
    """Search query text to find similar content"""
    query: String!

    """Maximum number of results to return"""
    limit: Int

    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): [SearchResult!]!

  """
  Search for RSS feed items similar to the query text (feed-specific search)
  """
  searchSimilarFeedItems(
    """Search query text to find similar feed items"""
    query: String!

    """Maximum number of results to return"""
    limit: Int

    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): [FeedItemSearchResult!]!

  """
  Search for RSS feed items similar to the item with the given ID (feed-specific search by ID)
  """
  searchSimilarFeedItemsById(
    """Feed item ID to find similar items for"""
    id: String!

    """Maximum number of results to return"""
    limit: Int

    """
    Minimum similarity score threshold (0.0-1.0, omit to return all results)
    """
    minScore: Float

    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): [FeedItemSearchResult!]!

  """Scroll through vector points in a collection with pagination"""
  scrollPoints(
    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"

    """Maximum number of points to return per page"""
    limit: Int = 20

    """Offset for pagination (from previous scroll result)"""
    offset: String
  ): ScrollPointsResult!

  """Retrieve a specific vector point by ID"""
  getPoint(
    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"

    """ID of the point to retrieve"""
    pointId: String!
  ): QdrantPoint

  """Search vector points by ID or title"""
  searchPoints(
    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"

    """Search term to match against point ID or title"""
    searchTerm: String!

    """Maximum number of results to return"""
    limit: Int = 20
  ): SearchPointsResult!

  """
  Load cached AI Feed content and related articles without triggering AI processing.
  """
  getReaderEnrichment(
    """FreshRSS server containing the article and its related coverage."""
    serverId: String!

    """Original FreshRSS article identifier."""
    itemId: String!
  ): ReaderEnrichment!

  """
  Capture a complete ordered snapshot of up to 50,000 matching FreshRSS item IDs for stable reader navigation
  """
  getReaderItemIds(
    """Configured FreshRSS server identifier"""
    serverId: String!

    """FreshRSS reading-list, feed, or folder stream identifier"""
    streamId: String!

    """Article state filter"""
    filter: ReaderFilter! = UNREAD

    """Article ordering"""
    order: ReaderOrder! = NEWEST
  ): [String!]!

  """Get the current status of the RSS feed processor"""
  getRssProcessorStatus(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): RssProcessorStatus!

  """Get grouping settings for a folder"""
  getFolderGroupingSettings(
    """Unique identifier of the folder"""
    folderId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): FolderGroupingSettings!

  """Get all article groups for a folder"""
  getArticleGroups(
    """Unique identifier of the folder"""
    folderId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"

    """Maximum number of groups to return"""
    limit: Int! = 50

    """Number of groups to skip for offset pagination"""
    offset: Int! = 0

    """Sort option for the groups"""
    sortBy: ArticleGroupSortBy! = DATE_DESC
  ): [ArticleGroup!]!

  """Get all article groups across all folders"""
  getAllArticleGroups(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"

    """Maximum number of groups to return"""
    limit: Int! = 50

    """Number of groups to skip for offset pagination"""
    offset: Int! = 0

    """Sort option for the groups"""
    sortBy: ArticleGroupSortBy! = DATE_DESC
  ): [ArticleGroup!]!

  """Get the Atom feed URL for a folder's grouped articles"""
  getGroupedFeedUrl(
    """Unique identifier of the folder"""
    folderId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): String!

  """Get a specific article group by ID"""
  getArticleGroup(
    """Unique identifier of the article group"""
    groupId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): ArticleGroup

  """Get similar-article match statistics grouped by UTC publication day"""
  getSimilarityStatistics(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"

    """Optional folder ID; omit to aggregate all folders"""
    folderId: String

    """Optional inclusive UTC start date in YYYY-MM-DD format"""
    startDate: String

    """
    Optional inclusive UTC end date in YYYY-MM-DD format; defaults to today
    """
    endDate: String
  ): SimilarityStatistics!
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

"""Root mutation type - extended by domain-specific schemas"""
type Mutation {
  """Empty field to ensure valid GraphQL schema"""
  _empty: String

  """Update application-wide AI configuration and credential operations"""
  updateAiFeedGlobalSettings(
    """New global configuration"""
    input: UpdateAiFeedGlobalSettingInput!
  ): AiFeedGlobalSetting!

  """
  Run the selected prompt and model against sample article content without saving it
  """
  testAiFeedPrompt(
    """One-off prompt test configuration"""
    input: TestAiFeedPromptInput!
  ): String!

  """Create or update one FreshRSS subscription's AI Feed configuration"""
  updateAiFeedSubscriptionSettings(
    """New per-subscription configuration"""
    input: UpdateAiFeedSubscriptionSettingInput!
  ): AiFeedSubscriptionSetting!

  """Apply one or more FreshRSS tags to an item"""
  setRssItemTags(
    """FreshRSS item identifier"""
    itemId: String!

    """Tag identifiers to apply"""
    tags: [String!]!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): SetRssItemTagsResult!

  """Remove one or more FreshRSS tags from an item"""
  removeRssItemTags(
    """FreshRSS item identifier"""
    itemId: String!

    """Tag identifiers to remove"""
    tags: [String!]!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): RemoveRssItemTagsResult!

  """
  Set a subscription's longest-article priority (0-1000). Recomputes the main article for the subscription's existing groups.
  """
  setSubscriptionPriority(
    """FreshRSS subscription id (feed id)"""
    feedId: String!

    """Priority value, 0-1000 (higher wins; 0 is the default/lowest)"""
    priority: Int!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): SetSubscriptionPriorityResult!

  """Create a new post"""
  createPost(
    """Post creation input data"""
    input: CreatePostInput!
  ): Post!

  """Update an existing post"""
  updatePost(
    """Unique identifier of the post to update"""
    id: String!

    """Post update input data"""
    input: UpdatePostInput!
  ): Post!

  """Delete a post permanently"""
  deletePost(
    """Unique identifier of the post to delete"""
    id: String!
  ): Post!

  """Set processing setting for an RSS tag folder"""
  setRssTagProcessing(
    """Unique identifier of the folder tag"""
    id: String!

    """Processing setting to apply"""
    processingSetting: ProcessingSetting!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): SetRssTagProcessingResult!

  """Create a new FreshRSS server"""
  createFreshRssServer(
    """FreshRSS server creation input data"""
    input: CreateFreshRssServerInput!
  ): FreshRssServer!

  """Update an existing FreshRSS server"""
  updateFreshRssServer(
    """Unique identifier of the server to update"""
    id: String!

    """FreshRSS server update input data"""
    input: UpdateFreshRssServerInput!
  ): FreshRssServer!

  """Delete a FreshRSS server permanently"""
  deleteFreshRssServer(
    """Unique identifier of the server to delete"""
    id: String!
  ): FreshRssServer!

  """Create a new Ollama server"""
  createOllamaServer(
    """Ollama server creation input data"""
    input: CreateOllamaServerInput!
  ): OllamaServer!

  """Update an existing Ollama server"""
  updateOllamaServer(
    """Unique identifier of the server to update"""
    id: String!

    """Ollama server update input data"""
    input: UpdateOllamaServerInput!
  ): OllamaServer!

  """Delete an Ollama server permanently"""
  deleteOllamaServer(
    """Unique identifier of the server to delete"""
    id: String!
  ): OllamaServer!

  """Create a new Qdrant server"""
  createQdrantServer(
    """Qdrant server creation input data"""
    input: CreateQdrantServerInput!
  ): QdrantServer!

  """Update an existing Qdrant server"""
  updateQdrantServer(
    """Unique identifier of the server to update"""
    id: String!

    """Qdrant server update input data"""
    input: UpdateQdrantServerInput!
  ): QdrantServer!

  """Delete a Qdrant server permanently"""
  deleteQdrantServer(
    """Unique identifier of the server to delete"""
    id: String!
  ): QdrantServer!

  """Add a document to the vector database with optional metadata"""
  addDocument(
    """Document content to be indexed"""
    content: String!

    """JSON metadata associated with the document"""
    metadata: String

    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): Boolean!

  """Delete specific vector points by their IDs"""
  deletePoints(
    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"

    """Array of point IDs to delete"""
    pointIds: [String!]!
  ): Boolean!

  """Clear all vector points from a collection"""
  clearCollection(
    """
    Qdrant server ID to use for the request (defaults to environment server)
    """
    serverId: String = "environment"
  ): Boolean!

  """
  Set read or starred state for up to 200 articles and verify each requested state against FreshRSS
  """
  setRssItemsState(
    """Configured FreshRSS server identifier"""
    serverId: String!

    """FreshRSS article identifiers; duplicates are updated once"""
    itemIds: [String!]!

    """Whether articles should be read; omitted leaves read state unchanged"""
    isRead: Boolean

    """
    Whether articles should be starred; omitted leaves starred state unchanged
    """
    isStarred: Boolean
  ): RssItemsStateResult!

  """Manually trigger RSS feed processing for all subscriptions"""
  processRssFeeds(
    """
    Whether to perform a full refresh, ignoring processed tags (defaults to false)
    """
    fullRefresh: Boolean = false

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): ProcessRssFeedsResult!

  """Cancel currently running RSS feed processing"""
  cancelRssProcessing(
    """Server ID to use for the request (defaults to environment server)"""
    serverId: String = "environment"
  ): CancelRssProcessingResult!

  """Update grouping settings for a folder"""
  updateFolderGroupingSettings(
    """Unique identifier of the folder"""
    folderId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"

    """Minimum cosine similarity threshold (0.0-1.0)"""
    similarityThreshold: Float

    """Time window in hours to look for similar articles"""
    timeWindowHours: Int

    """Delay in minutes before publishing to allow grouping"""
    publishDelayMinutes: Int

    """Maximum article age in days for reprocessing (1-3650; null = no limit)"""
    lookbackDays: Int
  ): FolderGroupingSettings!

  """Manually trigger similarity grouping for one or all folders"""
  triggerSimilarityGrouping(
    """
    Optional: specific folder to process (all SIMILARITY_GROUPING folders if omitted)
    """
    folderId: String

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): GroupingResult!

  """Clear all article groups for a folder and reprocess from scratch"""
  clearAndReprocessFolder(
    """Unique identifier of the folder"""
    folderId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): GroupingResult!

  """Remove an article from a group (makes it a standalone entry)"""
  removeArticleFromGroup(
    """Unique identifier of the article group"""
    groupId: String!

    """Qdrant document ID of the article to remove"""
    itemId: String!

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): Boolean!

  """Clean up expired article groups (older than timeWindowHours * 2)"""
  cleanupExpiredArticleGroups(
    """
    Optional: specific folder to clean up (all SIMILARITY_GROUPING folders if omitted)
    """
    folderId: String

    """Server ID to use for the request (defaults to environment server)"""
    serverId: String! = "environment"
  ): CleanupResult!
}

"""
Feed enclosure representing attached media files (images, audio, video)
"""
type FeedEnclosure {
  """URL of the enclosure file"""
  href: String!

  """MIME type of the enclosure (e.g., image/jpeg, audio/mp3)"""
  type: String!

  """Size of the enclosure file in bytes (optional)"""
  length: Int
}

"""Feed item summary/description content"""
type FeedSummary {
  """HTML or plain text content of the feed item summary"""
  content: String!
}

"""Origin information about the RSS feed source"""
type FeedOrigin {
  """Stream ID identifying the feed in Fresh RSS"""
